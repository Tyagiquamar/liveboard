services:
  mongo:
    image: mongo:7
    ports:
      - '${LB_MONGO_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${LB_REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/liveboard
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${LB_JWT_SECRET:-change-me-in-production}
      CLIENT_ORIGIN: ${LB_WEB_ORIGIN:-http://localhost:3000}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '${LB_API_PORT:-4000}:4000'

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${LB_API_PORT:-4000}/api
        NEXT_PUBLIC_WS_URL: http://localhost:${LB_API_PORT:-4000}
    depends_on:
      - server
    ports:
      - '${LB_WEB_PORT:-3000}:3000'

volumes:
  mongo-data:
